    <script>
      (function() {
        if (typeof window !== "undefined") {
          if (!window.crypto) {
            window.crypto = {};
          }
          if (!window.crypto.randomUUID) {
            window.crypto.randomUUID = function() {
              return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
              });
            };
          }
          if (typeof globalThis !== "undefined" && !globalThis.crypto) {
            globalThis.crypto = window.crypto;
          }
        }
      })();
    </script>
    <script>
      (function() {
        try {
          var savedTitle = localStorage.getItem("app_meta_title");
          if (savedTitle && savedTitle.trim()) {
            var path = window.location.pathname.replace(/\/$/, "") || "/";
            if (path === "/") {
              document.title = savedTitle.trim();
            } else {
              var routeNames = {
                "/login": "تسجيل الدخول",
                "/admin/login": "تسجيل دخول المشرفين",
                "/register": "إنشاء حساب جديد",
                "/dashboard": "الرئيسية",
                "/requester": "لوحة تحكم طالب الخدمة",
                "/supplier-registration": "تسجيل مورد جديد",
                "/supplier/join": "تسجيل مورد جديد",
                "/track": "متابعة الطلب",
                "/mosques": "المساجد",
                "/requests": "الطلبات",
                "/projects": "المشاريع",
                "/organization-settings": "إعدادات الجمعية",
                "/branding": "الهوية البصرية",
                "/suppliers": "الموردون",
                "/contracts": "العقود",
                "/disbursements": "طلبات الصرف",
                "/disbursement-orders": "أوامر الصرف",
                "/receipt-vouchers": "سندات القبض",
                "/staff": "إدارة المستخدمين والأدوار",
                "/users": "إدارة المستخدمين",
                "/roles": "إدارة الأدوار"
              };
              var pageName = routeNames[path];
              if (pageName) {
                document.title = pageName + " - " + savedTitle.trim();
              } else {
                document.title = savedTitle.trim();
              }
            }
          }
        } catch (e) {}
      })();
    </script>
    <!-- Favicon / Browser Tab Logo -->
